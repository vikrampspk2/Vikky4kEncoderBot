name: VIKKY Encoder CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Compile Python
        run: |
          python -m compileall -q app cloud/kaggle_worker

      - name: Security check
        run: |
          ! grep -RInE \
            --exclude-dir=.git \
            --exclude='*.pyc' \
            --exclude='.env' \
            '(BOT_TOKEN=|KAGGLE[12]_KEY=|KAGGLE[12]_USERNAME=|API_KEY=)' \
            app cloud config || true

      - name: Git status
        run: git status --short
