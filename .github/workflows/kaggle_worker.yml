name: VIKKY Kaggle GPU Worker

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "AI processing mode"
        required: true
        default: "4K_AI"
        type: choice
        options:
          - 2K_AI
          - 4K_AI
          - 8K_AI
          - 4K_HYBRID
          - 8K_HYBRID

permissions:
  contents: read

concurrency:
  group: vikky-kaggle-worker
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate worker files
        shell: bash
        run: |
          set -euo pipefail
          test -f cloud/kaggle_worker/main.py
          test -f cloud/kaggle_worker/requirements.txt
          test -f cloud/kaggle_worker/kernel-metadata.json
          python -m py_compile cloud/kaggle_worker/main.py
          echo "VIKKY WORKER VALIDATION: PASS"

  kaggle:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      VIKKY_MODE: ${{ inputs.mode }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Kaggle CLI
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install kaggle

      - name: Authenticate & Push Kernel
        shell: bash
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/vikky_kernel
          cp cloud/kaggle_worker/main.py /tmp/vikky_kernel/main.py
          cp cloud/kaggle_worker/requirements.txt /tmp/vikky_kernel/requirements.txt
          cp cloud/kaggle_worker/kernel-metadata.json /tmp/vikky_kernel/kernel-metadata.json

          cd /tmp/vikky_kernel
          kaggle kernels push
          echo "Kaggle kernel pushed successfully."

      - name: Monitor Execution & Fetch Logs
        shell: bash
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          echo "Tracking Kaggle GPU execution..."
          KERNEL_SLUG="mrvikky07/vikky-ai-worker"

          while true; do
            STATUS=$(kaggle kernels status "$KERNEL_SLUG" | awk '{print $NF}')
            echo "Current Kaggle status: $STATUS"
            if [ "$STATUS" == '"complete"' ] || [ "$STATUS" == "complete" ]; then
              echo "Execution finished successfully!"
              kaggle kernels output "$KERNEL_SLUG" -p /tmp/output
              ls -lah /tmp/output
              break
            elif [ "$STATUS" == '"error"' ] || [ "$STATUS" == "error" ]; then
              echo "Execution failed on Kaggle!"
              kaggle kernels output "$KERNEL_SLUG" -p /tmp/output || true
              cat /tmp/output/*.log || true
              exit 1
            fi
            sleep 20
          done
