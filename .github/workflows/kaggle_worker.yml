name: VIKKY Kaggle GPU Worker

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "AI processing mode"
        required: true
        default: "4K_AI"
        type: choice
        options:
          - 2K_AI
          - 4K_AI
          - 8K_AI
          - 4K_HYBRID
          - 8K_HYBRID

permissions:
  contents: read

concurrency:
  group: vikky-kaggle-worker
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate worker files
        shell: bash
        run: |
          set -euo pipefail
          test -f cloud/kaggle_worker/main.py
          test -f cloud/kaggle_worker/requirements.txt
          test -f cloud/kaggle_worker/kernel-metadata.json
          python -m py_compile cloud/kaggle_worker/main.py
          echo "VIKKY WORKER VALIDATION: PASS"

  kaggle:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      VIKKY_MODE: ${{ inputs.mode }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Kaggle CLI
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install kaggle

      - name: Monitor & Fetch Output Immediately
        shell: bash
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          KERNEL_SLUG="mrvikky07/vikky-ai-worker"
          echo "=== CURRENT STATUS ==="
          kaggle kernels status "$KERNEL_SLUG"
          
          echo "=== FETCHING LOGS/OUTPUT ==="
          mkdir -p /tmp/output
          kaggle kernels output "$KERNEL_SLUG" -p /tmp/output || true
          
          echo "=== LOG FILES FOUND ==="
          ls -lah /tmp/output
          
          echo "=== PRINTING LOG CONTENT ==="
          for f in /tmp/output/*; do
            echo "FILE: $f"
            cat "$f" || true
          done
